[package]
name = "finale-scores"
description = "Read Finale (.musx) score files and the EnigmaXML inside them"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scores-rs/finale-scores"

[dependencies]
flate2 = "1"
quick-xml = "0.42"
thiserror = "2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
